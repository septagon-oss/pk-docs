{{ define "platformkit.atom.brand" }}
<a class="pk-brand" href="/">
  <span class="pk-brand__mark" aria-hidden="true"></span>
  <span class="pk-brand__text">{{ .Branding.LogoAlt }}</span>
</a>
{{ end }}

{{ define "platformkit.atom.kicker" }}
{{ if . }}
<p class="pk-kicker">{{ . }}</p>
{{ end }}
{{ end }}

{{ define "platformkit.atom.primary_action" }}
<a class="pk-button pk-button--primary" href="{{ link .Href }}">{{ .Label }}</a>
{{ end }}

{{ define "platformkit.atom.secondary_action" }}
<a class="pk-button pk-button--secondary" href="{{ link .Href }}">{{ .Label }}</a>
{{ end }}
