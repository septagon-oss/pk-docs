schema_version: 2
component_id: platformkit-docs
title: PlatformKit Documentation
federation:
  assemblers:
    - antora
    - techdocs
  reference_sources:
    - openapi
    - asyncapi
    - jsonschema

# v2: collections define top-level tabs in the rendered docs site.
# sidebar_strategy is consumed by content_management when routing
# /docs/<collection>/... requests; keep values in sync with
# handleCollectionIndex in features/articles/public_handler.go.
collections:
  - id: architecture
    title: Architecture
    sidebar_strategy: arc42_ordered
    required: true
  - id: adr
    title: Decisions
    sidebar_strategy: adr_index
    required: true
  - id: validation
    title: Validation
    sidebar_strategy: category
    required: false
  - id: api
    title: API Reference
    sidebar_strategy: grouped_by_module
    required: false

# Architecture topics follow arc42 (§1..§12). The 12 sections +
# index cover the full template; any new section lands as an edit
# to the existing file, never as a stub.
repo_topics:
