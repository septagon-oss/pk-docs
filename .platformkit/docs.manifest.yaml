schema_version: 2
component_id: platformkit-docs
title: PlatformKit Documentation
federation:
  assemblers:
    - antora
    - techdocs
  reference_sources:
    - openapi
    - asyncapi
    - jsonschema

# v2: collections define top-level tabs in the rendered docs site.
# sidebar_strategy is consumed by content_management when routing
# /docs/<collection>/... requests; keep values in sync with
# handleCollectionIndex in features/articles/public_handler.go.
collections:
  - id: guides
    title: Current Guides
    sidebar_strategy: category
    required: true
  - id: adr
    title: Decisions
    sidebar_strategy: adr_index
    required: true
  - id: validation
    title: Validation
    sidebar_strategy: category
    required: false
  - id: api
    title: API Reference
    sidebar_strategy: grouped_by_module
    required: false

# Only current, public OSS guidance is federated. The numbered arc42 source
# describes a larger historical workspace and is intentionally excluded.
repo_topics:
  - id: current-overview
    title: What is PlatformKit?
    path: docs/current/overview.md
    dita_type: concept
    diataxis: explanation
    collection: guides
    authoring: authored
  - id: current-quickstart
    title: Quickstart
    path: docs/current/quickstart.md
    dita_type: task
    diataxis: tutorial
    collection: guides
    authoring: authored
  - id: current-extensions
    title: Build a secure extension
    path: docs/current/extensions.md
    dita_type: task
    diataxis: howto
    collection: guides
    authoring: authored
  - id: current-design-system
    title: Design system
