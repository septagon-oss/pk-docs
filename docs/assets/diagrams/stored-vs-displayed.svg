<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="title">
  <title id="title">Stored versus displayed: creating a notification or content record persists it and exposes it through the API and admin console; bells, toasts, emails, and public pages are downstream product features.</title>
  <style>
  .canvas { fill: #fffdf7; }
  .ink { fill: #15221f; }
  .muted { fill: #5f6b65; }
  .line { stroke: #8f988f; }
  .card { fill: #f2efe7; stroke: #cbc5b8; }
  .card-strong { fill: #fffdf7; stroke: #8f988f; }
  .accent { fill: #0f5d4e; }
  .accent-on { fill: #f9fff9; }
  .signal { fill: #d8f35d; }
  .dark { fill: #12201d; }
  .dark-text { fill: #eff4e9; }
  .dark-muted { fill: #aebbb2; }
  .ok { fill: #12715d; }
  .okbg { fill: #dcf3e8; }
  .warn { fill: #9a5318; }
  .warnbg { fill: #fff0d2; }
  .danger { fill: #9e3833; }
  .dangerbg { fill: #fbe5e2; }
  .focus { fill: #326de6; }
  .infobg { fill: #e3ecfb; }
  .arrow { stroke: #5f6b65; stroke-width: 2; fill: none; }
  .arrow-dashed { stroke: #8f988f; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
  .arrow-accent { stroke: #0f5d4e; stroke-width: 2.5; fill: none; }
  .t { font-family: 'IBM Plex Sans', Inter, 'Segoe UI', system-ui, sans-serif; }
  .m { font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    .canvas { fill: #15201d; }
    .ink { fill: #eaf1ea; }
    .muted { fill: #aebbb2; }
    .line { stroke: #4a5c55; }
    .card { fill: #1b2825; stroke: #2a3a35; }
    .card-strong { fill: #0e1513; stroke: #4a5c55; }
    .accent { fill: #5fc2a6; }
    .accent-on { fill: #0b1a16; }
    .okbg { fill: #16302a; } .ok { fill: #7ed3b5; }
    .warnbg { fill: #33271a; } .warn { fill: #f0b36b; }
    .dangerbg { fill: #3a1f1d; } .danger { fill: #f09a94; }
    .infobg { fill: #1c2a3f; } .focus { fill: #7aa7ff; }
    .arrow { stroke: #aebbb2; }
    .arrow-dashed { stroke: #6f827a; }
    .arrow-accent { stroke: #5fc2a6; }
  }
</style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b65"/></marker>
    <marker id="head-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0f5d4e"/></marker>
    <marker id="head-faint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#8f988f"/></marker>
  </defs>
  <rect class="canvas" width="1100" height="440" rx="16"/>
  <text x="40" y="42" class="ink t" font-size="22" font-weight="700" text-anchor="start" >Stored is not the same as displayed</text><text x="40" y="66" class="muted t" font-size="14" font-weight="400" text-anchor="start" >The starter persists and administers records. Where they appear to end users is your product's decision.</text><rect x="40" y="96" width="250" height="92" rx="10" class="dark" stroke-width="0"/><text x="56" y="126" class="signal m" font-size="13" font-weight="700" text-anchor="start" >POST /api/v1/notifications</text><text x="56" y="148" class="dark-muted m" font-size="11.5" font-weight="400" text-anchor="start" >{&quot;title&quot;:&quot;Build passed&quot;,</text>
<text x="56" y="164" class="dark-muted m" font-size="11.5" font-weight="400" text-anchor="start" > &quot;body&quot;:&quot;main is green&quot;}</text><line x1="292" y1="142" x2="330" y2="142" class="arrow-accent" marker-end="url(#head-accent)"/><rect x="336" y="96" width="190" height="92" rx="10" class="card-strong" stroke-width="1.5"/><text x="352" y="124" class="accent t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">stored record</text><text x="352" y="146" class="ink m" font-size="12" font-weight="400" text-anchor="start" >notification row</text>
<text x="352" y="162" class="ink m" font-size="12" font-weight="400" text-anchor="start" >tenant + user scoped</text>
<text x="352" y="178" class="ink m" font-size="12" font-weight="400" text-anchor="start" >read state, severity</text><line x1="528" y1="142" x2="566" y2="142" class="arrow-accent" marker-end="url(#head-accent)"/><rect x="572" y="96" width="230" height="92" rx="10" class="okbg" stroke-width="0"/><text x="588" y="124" class="ok t" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1.5">SHIPS IN THE STARTER</text><text x="588" y="146" class="ink t" font-size="12" font-weight="400" text-anchor="start" >GET /api/v1/notifications</text>
<text x="588" y="162" class="ink t" font-size="12" font-weight="400" text-anchor="start" >Admin → Notifications</text>
<text x="588" y="178" class="ink t" font-size="12" font-weight="400" text-anchor="start" >audit: notification.dispatched</text><line x1="804" y1="142" x2="842" y2="142" class="arrow-dashed" marker-end="url(#head-faint)"/><rect x="848" y="96" width="212" height="92" rx="10" class="card" stroke-width="1.5"/><text x="864" y="124" class="muted t" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1.5">YOURS TO BUILD</text><text x="864" y="146" class="muted t" font-size="12" font-weight="400" text-anchor="start" >navbar bell · inbox</text>
<text x="864" y="162" class="muted t" font-size="12" font-weight="400" text-anchor="start" >toast · email · SMS</text>
<text x="864" y="178" class="muted t" font-size="12" font-weight="400" text-anchor="start" >push · provider retries</text><rect x="40" y="214" width="250" height="92" rx="10" class="dark" stroke-width="0"/><text x="56" y="244" class="signal m" font-size="13" font-weight="700" text-anchor="start" >POST /api/v1/content</text><text x="56" y="266" class="dark-muted m" font-size="11.5" font-weight="400" text-anchor="start" >{&quot;kind&quot;:&quot;page&quot;,&quot;slug&quot;:&quot;welcome&quot;,</text>
<text x="56" y="282" class="dark-muted m" font-size="11.5" font-weight="400" text-anchor="start" > &quot;title&quot;:&quot;Welcome&quot;}</text><line x1="292" y1="260" x2="330" y2="260" class="arrow-accent" marker-end="url(#head-accent)"/><rect x="336" y="214" width="190" height="92" rx="10" class="card-strong" stroke-width="1.5"/><text x="352" y="242" class="accent t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">stored record</text><text x="352" y="264" class="ink m" font-size="12" font-weight="400" text-anchor="start" >content row</text>
<text x="352" y="280" class="ink m" font-size="12" font-weight="400" text-anchor="start" >draft → published_at</text>
<text x="352" y="296" class="ink m" font-size="12" font-weight="400" text-anchor="start" >body_format: markdown</text><line x1="528" y1="260" x2="566" y2="260" class="arrow-accent" marker-end="url(#head-accent)"/><rect x="572" y="214" width="230" height="92" rx="10" class="okbg" stroke-width="0"/><text x="588" y="242" class="ok t" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1.5">SHIPS IN THE STARTER</text><text x="588" y="264" class="ink t" font-size="12" font-weight="400" text-anchor="start" >GET /api/v1/content</text>
<text x="588" y="280" class="ink t" font-size="12" font-weight="400" text-anchor="start" >Admin → Content</text>
<text x="588" y="296" class="ink t" font-size="12" font-weight="400" text-anchor="start" >publish / unpublish actions</text><line x1="804" y1="260" x2="842" y2="260" class="arrow-dashed" marker-end="url(#head-faint)"/><rect x="848" y="214" width="212" height="92" rx="10" class="card" stroke-width="1.5"/><text x="864" y="242" class="muted t" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1.5">YOURS TO BUILD</text><text x="864" y="264" class="muted t" font-size="12" font-weight="400" text-anchor="start" >public URL scheme</text>
<text x="864" y="280" class="muted t" font-size="12" font-weight="400" text-anchor="start" >templates · theme</text>
<text x="864" y="296" class="muted t" font-size="12" font-weight="400" text-anchor="start" >audience policy · feed</text><rect x="40" y="332" width="1020" height="78" rx="10" class="infobg" stroke-width="0"/><text x="58" y="356" class="ink t" font-size="13.5" font-weight="700" text-anchor="start" >Why the gap is deliberate</text><text x="58" y="376" class="muted t" font-size="12" font-weight="400" text-anchor="start" >A bell, a toast, or a public page is a product decision — layout, audience, delivery provider, retry policy. The starter refuses to guess.</text>
<text x="58" y="393" class="muted t" font-size="12" font-weight="400" text-anchor="start" >Add your read model, routes, and renderer through starterapp.WithModules; the stored record, API, and operator console are already there.</text>
</svg>
