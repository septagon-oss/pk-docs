<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-labelledby="title">
  <title id="title">Sessions versus API keys: both are bearer tokens; sessions belong to people and can hold admin capabilities, API keys belong to machines and hold explicit scopes only.</title>
  <style>
  .canvas { fill: #fffdf7; }
  .ink { fill: #15221f; }
  .muted { fill: #5f6b65; }
  .line { stroke: #8f988f; }
  .card { fill: #f2efe7; stroke: #cbc5b8; }
  .card-strong { fill: #fffdf7; stroke: #8f988f; }
  .accent { fill: #0f5d4e; }
  .accent-on { fill: #f9fff9; }
  .signal { fill: #d8f35d; }
  .dark { fill: #12201d; }
  .dark-text { fill: #eff4e9; }
  .dark-muted { fill: #aebbb2; }
  .ok { fill: #12715d; }
  .okbg { fill: #dcf3e8; }
  .warn { fill: #9a5318; }
  .warnbg { fill: #fff0d2; }
  .danger { fill: #9e3833; }
  .dangerbg { fill: #fbe5e2; }
  .focus { fill: #326de6; }
  .infobg { fill: #e3ecfb; }
  .arrow { stroke: #5f6b65; stroke-width: 2; fill: none; }
  .arrow-dashed { stroke: #8f988f; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
  .arrow-accent { stroke: #0f5d4e; stroke-width: 2.5; fill: none; }
  .t { font-family: 'IBM Plex Sans', Inter, 'Segoe UI', system-ui, sans-serif; }
  .m { font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    .canvas { fill: #15201d; }
    .ink { fill: #eaf1ea; }
    .muted { fill: #aebbb2; }
    .line { stroke: #4a5c55; }
    .card { fill: #1b2825; stroke: #2a3a35; }
    .card-strong { fill: #0e1513; stroke: #4a5c55; }
    .accent { fill: #5fc2a6; }
    .accent-on { fill: #0b1a16; }
    .okbg { fill: #16302a; } .ok { fill: #7ed3b5; }
    .warnbg { fill: #33271a; } .warn { fill: #f0b36b; }
    .dangerbg { fill: #3a1f1d; } .danger { fill: #f09a94; }
    .infobg { fill: #1c2a3f; } .focus { fill: #7aa7ff; }
    .arrow { stroke: #aebbb2; }
    .arrow-dashed { stroke: #6f827a; }
    .arrow-accent { stroke: #5fc2a6; }
  }
</style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b65"/></marker>
    <marker id="head-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0f5d4e"/></marker>
    <marker id="head-faint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#8f988f"/></marker>
  </defs>
  <rect class="canvas" width="1100" height="330" rx="16"/>
  <text x="40" y="42" class="ink t" font-size="22" font-weight="700" text-anchor="start" >Two kinds of credential, one Authorization header</text><text x="40" y="66" class="muted t" font-size="14" font-weight="400" text-anchor="start" >Both travel as Authorization: Bearer &lt;token&gt;. They differ in who holds them and what they may do.</text><rect x="40" y="96" width="500" height="200" rx="12" class="card-strong" stroke-width="1.5"/><text x="58" y="128" class="ink t" font-size="18" font-weight="700" text-anchor="start" >Session</text><rect x="358.8" y="112" width="176.4" height="22" rx="11" class="okbg" stroke-width="0"/><text x="447" y="127" class="ok t" font-size="11" font-weight="600" text-anchor="middle" >a person who logged in</text><text x="58" y="160" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >POST /api/v1/auth/sessions → { &quot;id&quot;: … }</text>
<text x="58" y="184" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >or the pk_session cookie set by /admin/login</text>
<text x="58" y="208" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >carries the user's capabilities: the seeded</text>
<text x="58" y="232" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >operator has admin + console:access</text>
<text x="58" y="256" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >expires after 24 h; DELETE to log out</text><rect x="560" y="96" width="500" height="200" rx="12" class="card-strong" stroke-width="1.5"/><text x="578" y="128" class="ink t" font-size="18" font-weight="700" text-anchor="start" >API key</text><rect x="898.6" y="112" width="154.8" height="22" rx="11" class="okbg" stroke-width="0"/><text x="976" y="127" class="ok t" font-size="11" font-weight="600" text-anchor="middle" >a machine or script</text><text x="578" y="160" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >POST /api/v1/api-keys → { &quot;plaintext&quot;: &quot;pk_…&quot; }</text>
<text x="578" y="184" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >shown once; only the prefix is stored</text>
<text x="578" y="208" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >explicit scopes: content:read, users:write, …</text>
<text x="578" y="232" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >cannot hold admin or console:access</text>
<text x="578" y="256" class="muted m" font-size="12.5" font-weight="400" text-anchor="start" >revoke with DELETE /api/v1/api-keys/{id}</text>
</svg>
