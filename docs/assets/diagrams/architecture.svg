<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="title">
  <title id="title">Repository map: foundations feed the released set (pk-core, pk-modules, pk-apps, platformkit); your product extends the starter through WithModules; the toolchain gates it.</title>
  <style>
  .canvas { fill: #fffdf7; }
  .ink { fill: #15221f; }
  .muted { fill: #5f6b65; }
  .line { stroke: #8f988f; }
  .card { fill: #f2efe7; stroke: #cbc5b8; }
  .card-strong { fill: #fffdf7; stroke: #8f988f; }
  .accent { fill: #0f5d4e; }
  .accent-on { fill: #f9fff9; }
  .signal { fill: #d8f35d; }
  .dark { fill: #12201d; }
  .dark-text { fill: #eff4e9; }
  .dark-muted { fill: #aebbb2; }
  .ok { fill: #12715d; }
  .okbg { fill: #dcf3e8; }
  .warn { fill: #9a5318; }
  .warnbg { fill: #fff0d2; }
  .danger { fill: #9e3833; }
  .dangerbg { fill: #fbe5e2; }
  .focus { fill: #326de6; }
  .infobg { fill: #e3ecfb; }
  .arrow { stroke: #5f6b65; stroke-width: 2; fill: none; }
  .arrow-dashed { stroke: #8f988f; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
  .arrow-accent { stroke: #0f5d4e; stroke-width: 2.5; fill: none; }
  .t { font-family: 'IBM Plex Sans', Inter, 'Segoe UI', system-ui, sans-serif; }
  .m { font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    .canvas { fill: #15201d; }
    .ink { fill: #eaf1ea; }
    .muted { fill: #aebbb2; }
    .line { stroke: #4a5c55; }
    .card { fill: #1b2825; stroke: #2a3a35; }
    .card-strong { fill: #0e1513; stroke: #4a5c55; }
    .accent { fill: #5fc2a6; }
    .accent-on { fill: #0b1a16; }
    .okbg { fill: #16302a; } .ok { fill: #7ed3b5; }
    .warnbg { fill: #33271a; } .warn { fill: #f0b36b; }
    .dangerbg { fill: #3a1f1d; } .danger { fill: #f09a94; }
    .infobg { fill: #1c2a3f; } .focus { fill: #7aa7ff; }
    .arrow { stroke: #aebbb2; }
    .arrow-dashed { stroke: #6f827a; }
    .arrow-accent { stroke: #5fc2a6; }
  }
</style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b65"/></marker>
    <marker id="head-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0f5d4e"/></marker>
    <marker id="head-faint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#8f988f"/></marker>
  </defs>
  <rect class="canvas" width="1100" height="640" rx="16"/>
  <text x="40" y="42" class="ink t" font-size="22" font-weight="700" text-anchor="start" >How the repositories fit together</text><text x="40" y="66" class="muted t" font-size="14" font-weight="400" text-anchor="start" >Arrows point from what is used to what uses it. You only ever depend on the released set.</text><rect x="40" y="96" width="250" height="512" rx="14" class="card" stroke-width="1.5"/><text x="58" y="124" class="muted t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">FOUNDATIONS</text><text x="58" y="142" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >move fastest · design system</text><rect x="56" y="164" width="218" height="60" rx="8" class="card-strong" stroke-width="1.5"/><text x="70" y="189" class="ink m" font-size="13.5" font-weight="700" text-anchor="start" >pk-design</text><text x="70" y="209" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >tokens, themes, WCAG contrast</text><rect x="56" y="242" width="218" height="60" rx="8" class="card-strong" stroke-width="1.5"/><text x="70" y="267" class="ink m" font-size="13.5" font-weight="700" text-anchor="start" >tw</text><text x="70" y="287" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >typed utility classes + CSS</text><rect x="56" y="320" width="218" height="60" rx="8" class="card-strong" stroke-width="1.5"/><text x="70" y="345" class="ink m" font-size="13.5" font-weight="700" text-anchor="start" >styleengine</text><text x="70" y="365" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >typed CSS build + sanitize</text><rect x="56" y="398" width="218" height="60" rx="8" class="card-strong" stroke-width="1.5"/><text x="70" y="423" class="ink m" font-size="13.5" font-weight="700" text-anchor="start" >pk-ui</text><text x="70" y="443" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >accessible Go components</text><rect x="56" y="476" width="218" height="60" rx="8" class="card-strong" stroke-width="1.5"/><text x="70" y="501" class="ink m" font-size="13.5" font-weight="700" text-anchor="start" >pk-client</text><text x="70" y="521" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >call a PlatformKit API</text><rect x="330" y="96" width="430" height="512" rx="14" class="card" stroke-width="1.5"/><text x="348" y="124" class="muted t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">RELEASED SET</text><text x="348" y="142" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >tagged together · boot-tested as a whole</text><rect x="348" y="160" width="394" height="98" rx="12" class="card-strong" stroke-width="1.5"/><text x="366" y="184" class="accent t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">CONTRACTS</text><text x="366" y="210" class="ink m" font-size="16" font-weight="700" text-anchor="start" >pk-core · pk-shared · pk-runtime</text><text x="366" y="232" class="muted t" font-size="12" font-weight="400" text-anchor="start" >module, identity, and runtime contracts;</text>
<text x="366" y="248" class="muted t" font-size="12" font-weight="400" text-anchor="start" >shared vocabulary; hosting and health</text><line x1="545" y1="260" x2="545" y2="280" class="arrow" marker-end="url(#head)"/><rect x="348" y="284" width="394" height="98" rx="12" class="card-strong" stroke-width="1.5"/><text x="366" y="308" class="accent t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">IMPLEMENTATION</text><text x="366" y="334" class="ink m" font-size="16" font-weight="700" text-anchor="start" >pk-modules</text><text x="366" y="356" class="muted t" font-size="12" font-weight="400" text-anchor="start" >the ten reference modules and the admin console;</text>
<text x="366" y="372" class="muted t" font-size="12" font-weight="400" text-anchor="start" >every store passes the same conformance suite</text><line x1="545" y1="384" x2="545" y2="404" class="arrow" marker-end="url(#head)"/><rect x="348" y="408" width="394" height="98" rx="12" class="card-strong" stroke-width="1.5"/><text x="366" y="432" class="accent t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">COMPOSITION</text><text x="366" y="458" class="ink m" font-size="16" font-weight="700" text-anchor="start" >pk-apps / pkg/starterapp</text><text x="366" y="480" class="muted t" font-size="12" font-weight="400" text-anchor="start" >the one canonical starter composition</text>
<text x="366" y="496" class="muted t" font-size="12" font-weight="400" text-anchor="start" >and the WithModules seam</text><line x1="545" y1="508" x2="545" y2="528" class="arrow" marker-end="url(#head)"/><rect x="348" y="532" width="394" height="62" rx="12" class="card-strong" stroke-width="1.5"/><text x="366" y="556" class="accent t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">FRONT DOOR</text><text x="366" y="582" class="ink m" font-size="16" font-weight="700" text-anchor="start" >platformkit  →  go run .</text><rect x="800" y="96" width="260" height="190" rx="14" class="okbg" stroke-width="0"/><text x="818" y="124" class="ok t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">YOUR PRODUCT</text><text x="818" y="150" class="ink m" font-size="16" font-weight="700" text-anchor="start" >acme/</text><text x="818" y="176" class="muted t" font-size="12.5" font-weight="400" text-anchor="start" >main.go boots the starter</text>
<text x="818" y="193" class="muted t" font-size="12.5" font-weight="400" text-anchor="start" >mod_invoice.go, migrations,</text>
<text x="818" y="210" class="muted t" font-size="12.5" font-weight="400" text-anchor="start" >tests — all in your repo</text><text x="818" y="262" class="ok m" font-size="12" font-weight="600" text-anchor="start" >platformkit new app acme</text><path d="M 742 449 C 790 449, 770 200, 798 200" class="arrow-accent" marker-end="url(#head-accent)"/><rect x="742" y="300" width="100" height="22" rx="11" class="dark" stroke-width="0"/><text x="792" y="315" class="signal m" font-size="10.5" font-weight="700" text-anchor="middle" >WithModules</text><rect x="800" y="330" width="260" height="278" rx="14" class="card" stroke-width="1.5"/><text x="818" y="358" class="muted t" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">TOOLCHAIN</text><text x="818" y="376" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >gates and generates · not linked in</text><rect x="818" y="398" width="224" height="50" rx="8" class="card-strong" stroke-width="1.5"/><text x="832" y="417" class="ink m" font-size="13" font-weight="700" text-anchor="start" >pk-guard</text><text x="832" y="434" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >go/analysis guardrails</text><rect x="818" y="462" width="224" height="50" rx="8" class="card-strong" stroke-width="1.5"/><text x="832" y="481" class="ink m" font-size="13" font-weight="700" text-anchor="start" >pk-tools</text><text x="832" y="498" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >pk new module · pk explain</text><rect x="818" y="526" width="224" height="50" rx="8" class="card-strong" stroke-width="1.5"/><text x="832" y="545" class="ink m" font-size="13" font-weight="700" text-anchor="start" >pk-testkit</text><text x="832" y="562" class="muted t" font-size="11.5" font-weight="400" text-anchor="start" >conformance + flow tests</text><path d="M 292 340 C 312 340, 312 333, 330 333" class="arrow-dashed" marker-end="url(#head-faint)"/><text x="300" y="322" class="muted t" font-size="9.5" font-weight="400" text-anchor="start" >consumed</text>
</svg>
