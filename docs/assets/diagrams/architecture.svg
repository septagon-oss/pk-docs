<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-labelledby="title">
  <title id="title">PlatformKit OSS system architecture: users and clients reach the platformkit front door, which boots the pk-apps starter composition hosted by pk-runtime. Typed contracts, reference modules, and UI foundations feed the composition; application modules join through WithModules; build-time tools scaffold and verify them; module stores use SQLite or Postgres.</title>
